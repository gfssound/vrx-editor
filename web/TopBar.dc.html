<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar (VRX Editor)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; box-sizing: border-box; background: linear-gradient(180deg, #34373c 0%, #24262a 55%, #1c1e21 100%); border-bottom: 2px solid #0d0e10; flex-wrap: wrap; font-family: Rajdhani, Helvetica, Arial, sans-serif; color: #e2e4e8">
<span style="font-weight: 700; font-size: 20px; letter-spacing: 0.2em">VRX EDITOR</span>
<span style="font-family: Inter, Helvetica, Arial, sans-serif; font-size: 12px; color: #8d929a">For Zaxcom VRX receivers over USB · not made by Zaxcom</span>
<sc-if value="{{sim}}" hint-placeholder-val="{{false}}"><span style="padding: 3px 10px; border-radius: 999px; border: 1px solid #c98a12; color: #f5b51c; font-family: Inter, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700">SIMULATED UNITS</span></sc-if>
<sc-if value="{{hasErr}}" hint-placeholder-val="{{false}}"><span role="alert" title="{{errTitle}}" style="padding: 3px 10px; border-radius: 6px; border: 1px solid #ff5a5a; background: rgba(255,90,90,0.12); color: #ffb3b3; font-family: Inter, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; max-width: 560px">{{errText}}</span></sc-if>
<span style="margin-left: auto; font-family: Inter, Helvetica, Arial, sans-serif; font-size: 12px; color: #8d929a">{{ver}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"string","default":"VRX"},"$preview":{"width":1280,"height":64}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.link = (typeof window !== 'undefined' && window.GuiBridgeLink) || null;
    if (this.link) this._unsub = this.link.subscribe(() => this.forceUpdate());
  }
  componentWillUnmount() { if (this._unsub) this._unsub(); }
  renderVals() {
    const i = (this.link && this.link.state.info) || {};
    const errs = (this.link && this.link.state.portErrors) || [];
    return { sim: !!i.simulate, ver: i.version ? 'v' + i.version : '', hasErr: errs.length > 0, errText: errs.length ? errs[0].hint : '', errTitle: errs.map((e) => e.port + ': ' + e.error).join('\n') };
  }
}
</script>
</body>
</html>
